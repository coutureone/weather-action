<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="background" x1="54" y1="52" x2="458" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1677FF"/>
      <stop offset="0.56" stop-color="#139DEB"/>
      <stop offset="1" stop-color="#20C7D4"/>
    </linearGradient>
    <radialGradient id="light" cx="0" cy="0" r="1" gradientTransform="translate(142 116) rotate(45) scale(330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.22"/>
