name: News Brief Bot

on:
  schedule:
    # 新闻通知由软路由在北京时间 08:00 发送；这里仅在 08:17 归档。
    # 避开 GitHub Actions 每小时整点的高峰。
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: 'Checkout codes'
        uses: actions/checkout@v4

      - name: 'Get DataSource'
        run: |
          curl --fail --location --silent --show-error \
            --connect-timeout 5 --max-time 15 --retry 1 --retry-delay 2 \
            --output result.html https://news.topurl.cn/

      - name: 'Get Info'
        run: python3 ./getInfo.py

      - name: 'Get Date'
        run: |
          echo "TODAY_DATE=$(TZ=Asia/Shanghai date +'%Y-%m-%d')" >> "$GITHUB_ENV"

#      - name: 'Send mail'
#        uses: dawidd6/action-send-mail@master
#        with:
#          server_address: smtp.163.com
#          server_port: 465
#          username: ${{ secrets.MAIL_USER_NMAE }}
#          password: ${{ secrets.MAIL_PWD }}
#          subject: 今日新闻简报推送 (${{env.REPORT_DATE}})
#          body: file://result.txt
#          to: coutureone@163.com
#          from: GitHub Actions
#          content_type: text/html

      - name: '打完收工,提交代码!'
        run: |
          git config --local user.email "couturecome@gamil.com"
          git config --local user.name "coutureone"
          currentDate=${{env.TODAY_DATE}}
          mkdir -p "${currentDate%%-*}"
          cp result.txt "${currentDate%%-*}/${currentDate}.txt"
          git add result.html result.txt "${currentDate%%-*}/${currentDate}.txt"
          if git diff --cached --quiet; then
            echo "今日内容无变化"
            exit 0
          fi
          git commit -m "Update By Github Action Bot (${{env.TODAY_DATE}})"
          git push origin HEAD:master
