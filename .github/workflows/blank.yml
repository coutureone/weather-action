name: News Brief Bot

on:
  schedule:
    # 避开 GitHub Actions 整点高峰；计划时间为北京时间 08:03。
    - cron: "3 8 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: 'Checkout codes'
        uses: actions/checkout@v4

      - name: 'Get DataSource'
        run: |
          curl --fail --location --silent --show-error \
            --connect-timeout 5 --max-time 15 --retry 1 --retry-delay 2 \
            --output result.html https://news.topurl.cn/

      - name: 'Get Info'
        run: python3 ./getInfo.py

      - name: 'Get Date'
        run: |
          echo "TODAY_DATE=$(TZ=Asia/Shanghai date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: '通过 Tink 发送三端通知'
        env:
          TINK_API_URL: ${{ secrets.TINK_API_URL }}
          TINK_API_KEY: ${{ secrets.TINK_API_KEY }}
          TINK_DEVICE_IDS: ${{ secrets.TINK_DEVICE_IDS }}
          TINK_BARK_DEVICE_KEY: ${{ secrets.TINK_BARK_DEVICE_KEY }}
        run: python3 ./notify.py

      - name: '打完收工,提交代码!'
        run: |
          git config --local user.email "couturecome@gamil.com"
          git config --local user.name "coutureone"
          currentDate=${{env.TODAY_DATE}}
          mkdir -p "${currentDate%%-*}"
          cp result.txt "${currentDate%%-*}/${currentDate}.txt"
          git add result.html result.txt "${currentDate%%-*}/${currentDate}.txt"
          if git diff --cached --quiet; then
            echo "今日内容无变化"
            exit 0
          fi
          git commit -m "Update By Github Action Bot (${{env.TODAY_DATE}})"
          git push origin HEAD:master
