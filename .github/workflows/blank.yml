name: News Brief Bot

on:
  schedule:
    # UTC 23:00 相当于北京时间（+8）的早上 07:00
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: 'Checkout codes'
        # 升级到 v4，确保安全性
        uses: actions/checkout@v4 

      - name: python env
        # 升级到 actions/setup-python@v5
        uses: actions/setup-python@v5 
        with:
          # 使用通配形式 '3.9' 解决精确版本找不到的问题
          python-version: '3.9' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel twine
          pip install bs4

      - name: 'Get DataSource'
        run: curl https://news.topurl.cn > ./result.html

      - name: 'Get Info'
        run: python ./getInfo.py

      - name: 'Get Date'
        run: |
          # 设置东八区时间
          echo "REPORT_DATE=$(TZ=':Asia/Shanghai' date '+%Y-%m-%d %T')" >> $GITHUB_ENV
          echo "TODAY_DATE=$(TZ=':Asia/Shanghai' date +'%Y-%m-%d')" >> $GITHUB_ENV

#      - name: 'Send mail'
#        uses: dawidd6/action-send-mail@master
#        with:
#          server_address: smtp.163.com
#          server_port: 465
#          username: ${{ secrets.MAIL_USER_NMAE }}
#          password: ${{ secrets.MAIL_PWD }}
#          subject: 今日新闻简报推送 (${{env.REPORT_DATE}})
#          body: file://result.txt
#          to: coutureone@163.com
#          from: GitHub Actions
#          content_type: text/html

      - name: '发送 Bark 全文通知'
        env:
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
        run: |
          if [ -z "$BARK_DEVICE_KEY" ]; then
            echo "BARK_DEVICE_KEY 未配置"
            exit 1
          fi

          payload="$RUNNER_TEMP/bark-payload.json"
          jq -n \
            --arg device_key "$BARK_DEVICE_KEY" \
            --arg title "今日新闻简报 ($TODAY_DATE)" \
            --rawfile body ./result.txt \
            '{
              device_key: $device_key,
              title: $title,
              body: $body,
              group: "weather-action",
              sound: "minuet.caf"
            }' > "$payload"

          payload_size=$(wc -c < "$payload")
          if [ "$payload_size" -gt 4000 ]; then
            echo "Bark 请求体 ${payload_size} 字节，超过安全限制，为避免全文被截断已停止发送"
            exit 1
          fi

          response=$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --retry 2 \
            -X POST 'https://api.day.app/push' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary "@$payload")

          echo "$response" | jq -e '.code == 200' > /dev/null
          echo "Bark 全文通知发送成功"

      # Telegram通知（可选）
      # - name: Telegram通知
      #   run: |
      #     curl "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
      #     -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
      #     -d "text=${{env.FILE_TEXT}}"

      - name: '打完收工,提交代码!'
        run: |
          git config --local user.email "couturecome@gamil.com"
          git config --local user.name "coutureone"
          # 使用 GITHUB_TOKEN 是更安全的做法，这里假设 MYGG_TOKEN 是具有 repo 权限的个人访问令牌
          git remote set-url origin https://${{ github.actor }}:${{ secrets.MYGG_TOKEN }}@github.com/${{ github.repository }}
          git pull
          currentDate=${{env.TODAY_DATE}}
          # 创建并复制文件到以年份命名的文件夹中
          mkdir -p  ${currentDate%%-*} && cp result.txt ${currentDate%%-*}/${currentDate}.txt
          git add .
          git commit -m "Update By Github Action Bot (${{env.TODAY_DATE}})"
          git push
